<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Semana 04 - Arrays, DOM e Eventos
    </title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
        }

        .destaque {
            color: blue;
            font-weight: bold;
        }

        .feito {
            text-decoration: line-through;
            color: gray;
        }

        li {
            margin-bottom: 8px;
            cursor: pointer;
        }

        input,
        button {
            padding: 8px;
            margin: 5px;
        }

    </style>

    <script src="app.js" defer></script>
</head>

<body>

    <h1 id="titulo">
        Blog
    </h1>


    <p class="texto">
        Este é o primeiro parágrafo do blog.
    </p>

    <p class="texto">
        Este é o segundo parágrafo do blog.
    </p>


    <h2>
        Lista
    </h2>


    <!--
        Os três itens abaixo foram adicionados
        diretamente no HTML conforme solicitado
        no exercício de Event Delegation.
    -->

    <ul id="lista">

        <li>
            Item HTML 1
        </li>

        <li>
            Item HTML 2
        </li>

        <li>
            Item HTML 3
        </li>

    </ul>


    <hr>


    <h2>
        Teste de Eventos
    </h2>


    <button id="botao">
        Clique aqui
    </button>


    <br>


    <label for="nome">
        Nome:
    </label>

    <input
        type="text"
        id="nome"
        placeholder="Digite seu nome"
    >


    <hr>


    <h2>
        Adicionar tarefa
    </h2>


    <form id="formulario">

        <label for="tarefa">
            Tarefa:
        </label>

        <input
            type="text"
            id="tarefa"
            placeholder="Digite uma tarefa"
        >


        <button type="submit">
            Adicionar tarefa
        </button>

    </form>

</body>

</html>
